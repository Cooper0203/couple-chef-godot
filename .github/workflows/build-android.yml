name: Build Couple Chef Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        run: |
          ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -L --fail -o /tmp/android-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/android-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip fontconfig

      - name: Install Godot and export templates
        run: |
          V="4.7.2"
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/$V.stable"
          curl -L --fail -o "$HOME/godot/godot.zip" "https://github.com/godotengine/godot/releases/download/$V-stable/Godot_v$V-stable_linux.x86_64.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          sudo install "$HOME/godot/Godot_v$V-stable_linux.x86_64" /usr/local/bin/godot
          curl -L --fail -o "$HOME/godot/templates.tpz" "https://github.com/godotengine/godot/releases/download/$V-stable/Godot_v$V-stable_export_templates.tpz"
          unzip -q "$HOME/godot/templates.tpz" -d "$HOME/godot/templates"
          cp -a "$HOME/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/$V.stable/"

      - name: Prepare output
        run: mkdir -p build

      - name: Validate project
        run: godot --headless --editor --path . --quit

      - name: Check GDScript for errors
        run: |
          set +e
          godot --headless --path . --check-only --script res://scripts/main.gd 2>&1 | tee script-check.log
          set -e
          if grep -qi "parse error\|script error" script-check.log; then
            echo "::error::GDScript has errors in scripts/main.gd. See the log above."
            exit 1
          fi
          echo "Script check passed."

      - name: Check internet permission for multiplayer
        run: |
          grep -n "permissions/internet" export_presets.cfg || echo "WARNING: internet permission line not found in export_presets.cfg - LAN multiplayer will not work."

      - name: Export Android APK
        run: godot --headless --path . --export-debug "Android" build/CoupleChef.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoupleChef-Android-APK
          path: build/CoupleChef.apk
          if-no-files-found: error
          retention-days: 14
